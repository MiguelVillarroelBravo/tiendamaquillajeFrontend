<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registro de Usuario - Norbert</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Caacupe+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <script src="js/validaciones.js"></script>
    <script src="js/regiones.js"></script>
</head>
<body>


    <div id="header_tienda">
        <p id="nombre_sitio">Norbert</p>

        <p id="menu_tienda">
            <a href="pagina_principal_home.html">Home</a> |
            <a href="productos.html">Productos</a> |
            <a href="nosotros.html">Nosotros</a> |
            <a href="blogs.html">Blogs</a> |
            <a href="contacto.html">Contacto</a>
        </p>

        <div id="carrito_tienda">
            <a href="carrito.html" class="boton_carrito">🛒 Cart (0)</a>
        </div>
    </div>



    <!-- Enlaces de usuario -->
    <div id="enlaces_usuario">
        <a href="iniciar_sesion.html">Iniciar sesión</a> | 
        <a href="registro_usuario.html">Registrar usuario</a>
    </div>



    <!-- Formulario de Registro -->
    <div id="contenedor_formulario_registro">
        <form id="form_registro_cliente">
            <fieldset class="caja_registro">
                <legend class="titulo_caja_registro">Registro de usuario</legend>

                <label for="campo_nombre_completo">NOMBRE COMPLETO</label>
                <input type="text" id="campo_nombre_completo" name="campo_nombre_completo">
                <span class="error" id="mensaje_campo_nombre_completo"></span><br><br>

                <label for="campo_rut">RUT</label>
                <input type="text" id="campo_rut" name="campo_rut" placeholder="12345678K">
                <span class="error" id="mensaje_campo_rut"></span><br><br>

                <label for="campo_correo">CORREO</label>
                <input type="text" id="campo_correo" name="campo_correo">
                <span class="error" id="mensaje_campo_correo"></span><br><br>

                <label for="campo_clave">CONTRASEÑA</label>
                <input type="password" id="campo_clave" name="campo_clave">
                <span class="error" id="mensaje_campo_clave"></span><br><br>

                <label for="campo_confirmar_clave">CONFIRMAR CONTRASEÑA</label>
                <input type="password" id="campo_confirmar_clave" name="campo_confirmar_clave">
                <span class="error" id="mensaje_campo_confirmar_clave"></span><br><br>

                <label for="campo_telefono">TELÉFONO (opcional)</label>
                <input type="text" id="campo_telefono" name="campo_telefono">
                <span class="error" id="mensaje_campo_telefono"></span><br><br>



                <!-- Selectores de Región y Comuna -->
                <div class="columnas_region_comuna">
                    <div class="col_select">
                        <label for="campo_region">REGIÓN</label>
                        <select name="campo_region" id="campo_region" onchange="actualizar_comunas()">
                            <!-- Se puebla mediante regiones.js -->
                        </select>
                    </div>




                    <div class="col_select">
                        <label for="campo_comuna">COMUNA</label>
                        <select name="campo_comuna" id="campo_comuna">
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                    </div>
                    <div style="clear: both;"></div>
                </div><br>



                <div class="centrar_boton">
                    <button type="button" onclick="procesar_usuario()" class="boton_registrar">REGISTRAR</button>
                </div>
            </fieldset>
        </form>
    </div>



    <!-- Pie de página -->
    <div id="footer_tienda">
        <div class="col_footer">
            <p><strong>Norbert</strong></p>
            <p>VISA | MC | AMEX</p>
        </div>

        <div class="col_footer">
            <p>
                <a href="productos.html?cat=labios">Labios</a> | 
                <a href="productos.html?cat=rostro">Rostro</a> | 
                <a href="productos.html?cat=ojos">Ojos</a>
            </p>
        </div>

        <div class="col_footer">
            <p>¡Boletín de noticias!</p>
            <form action="#">
                <input type="text" placeholder="Ingresa tu email">
                <button type="button">Suscribirse</button>
            </form>
        </div>

        <div style="clear: both;"></div>
    </div>

</body>
</html>
