        <div id="contenido_admin">
            <h1 id="titulo_usuarios">Editar Usuario</h1>
            <p id="intro_usuarios">Actualiza los datos del usuario registrado en el sistema.</p>

            <form id="form_usuario">
                <fieldset>
                    <legend>Editar Datos del Usuario</legend>
                    
                    <label for="campo_rut">RUT:</label>
                    <input type="text" name="campo_rut" id="campo_rut" value="12345678" readonly style="background-color: #eee;">
                    <span class="error" id="mensaje_campo_rut"></span><br><br>
                    
                    <label for="campo_correo">Correo:</label>
                    <input type="text" name="campo_correo" id="campo_correo" value="alumno@duoc.cl">
                    <span class="error" id="mensaje_campo_correo"></span><br><br>
                    
                    <label for="campo_region">Región:</label>
                    <select name="campo_region" id="campo_region" onchange="actualizar_comunas()">
                        
                    </select><br><br>
                    
                    <label for="campo_comuna">Comuna:</label>
                    <select name="campo_comuna" id="campo_comuna">
                        <option value="">Seleccione una comuna</option>
                    </select><br><br>
                    
                    <button type="button" onclick="procesar_usuario()">Actualizar Usuario</button>
                </fieldset>
            </form>
        </div>

    </div>

</body>
